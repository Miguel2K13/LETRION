# Ambiente de desenvolvimento Base44 para o LETRION.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#   http://localhost:3000/          -> app (HTML fonte, com a Lexi)
#   http://localhost:3000/loja/     -> pacote publicado (sem chaves de IA, sem Lexi)
#
# O app é um único arquivo HTML autocontido: não há bundler nem hot reload.
# Depois de editar o HTML, chame `reload_preview` para ver a mudança.
services:
  # Serviço de uma vez só: gera `www/` (a versão que vai para as lojas).
  build-store:
    image: node:22-alpine
    working_dir: /srv/app
    volumes:
      - ./:/srv/app
    command: ["node", "scripts/build-store.mjs"]
    restart: "no"

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/srv/app:ro
      - ./nginx.base44.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      build-store:
        condition: service_completed_successfully
    restart: on-failure
    labels:
      base44.project: "LETRION"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1/
          || { echo "app: FALHOU"; exit 1; };
          wget -q -O /dev/null http://127.0.0.1/loja/
          || { echo "pacote de loja: FALHOU"; exit 1; }
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
