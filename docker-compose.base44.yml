# Ambiente de desenvolvimento Base44 — LETRION
#
# O LETRION é um aplicativo de página única (HTML + Canvas) sem etapa de build:
# o servidor web serve o próprio código-clone do repositório, então qualquer
# edição em index.html (ou em games/**) já aparece ao recarregar a página.
# Por isso o serviço web é um nginx de infraestrutura com o repositório
# montado em modo leitura, e não uma imagem de aplicação pré-construída.

services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./base44/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      base44.project: "LETRION"
      base44.kind: "web"
      base44.port: "3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
