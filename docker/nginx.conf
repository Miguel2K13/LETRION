# Config completa do nginx para o preview do sandbox.
# O diretório montado (/site) pertence ao root com permissão 700, por isso os
# workers rodam como root apenas neste ambiente de desenvolvimento.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # O app é um único HTML de ~8 MB; comprime para o preview carregar rápido.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    # Serve o repositório inteiro (não o arquivo isolado): assim edições no HTML
    # aparecem ao recarregar, mesmo quando o editor troca o inode do arquivo.
    root /site;
    index LETRION_COM_LEXI_PRO_V19_BASE_OPENROUTER_BAIXA_COTA-1.html;

    location / {
      try_files $uri $uri/ /LETRION_COM_LEXI_PRO_V19_BASE_OPENROUTER_BAIXA_COTA-1.html;
    }
  }
}
