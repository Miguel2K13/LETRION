# Sandbox web entry point for LETRION.
# - "/"      -> o HTML autocontido do app (fonte do repositório)
# - "/api/"  -> API Node/Express com Postgres (contas, progresso, lições, Lexi)
server {
  listen 80;
  server_name _;

  root /srv/app;
  index index.html;

  # o DNS do Docker muda de IP quando um serviço é recriado: re-resolve sempre
  resolver 127.0.0.11 ipv6=off valid=10s;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/xml;
  gzip_min_length 1024;
  gzip_proxied any;

  location /api/ {
    set $letrion_api http://api:3000;
    proxy_pass $letrion_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # respostas em streaming do chat da Lexi
    proxy_read_timeout 300s;
    client_max_body_size 16m;
  }

  location /assets/ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # o navegador pede /favicon.ico: serve a mesma arte do mascote
  location = /favicon.ico {
    alias /srv/app/assets/letrion-mascote.svg;
    add_header Cache-Control "no-store";
  }

  location / {
    # always serve the current source, never a cached copy
    add_header Cache-Control "no-store";
    try_files $uri $uri/ =404;
  }
}
