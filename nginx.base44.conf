# LETRION — entrada pública do ambiente de desenvolvimento (porta 3000 do host).
#
# Este arquivo é a configuração COMPLETA do nginx (contexto principal), não um
# pedaço de `conf.d`, porque precisamos do `user root`: no sandbox a pasta do
# repositório é 0700 (root), e o usuário padrão `nginx` não consegue ler o HTML.
#
#   /        -> o HTML fonte do app (com a Lexi, como você edita no dia a dia)
#   /loja/   -> o pacote publicado gerado por scripts/build-store.mjs (sem IA)
user root;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    # o app é um HTML de ~8 MB que sai em ~0,5 MB comprimido
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /srv/app;
        index LETRION_COM_LEXI_PRO_V19_BASE_OPENROUTER_BAIXA_COTA-1.html;
        charset utf-8;

        location / {
            try_files $uri $uri/ =404;
        }

        location /loja/ {
            alias /srv/app/www/;
            index index.html;
        }
    }
}
