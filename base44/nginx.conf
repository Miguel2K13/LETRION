server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is a single self-contained HTML file kept at the repo root.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
}
