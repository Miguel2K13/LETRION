# nginx do preview Base44 — LETRION (ambiente de desenvolvimento)
#
# Por que um nginx.conf próprio:
#  - O repositório só pode ser servido se o worker do nginx puder atravessar o
#    diretório montado (a raiz do sandbox é 0700 e pertence ao root), então o
#    worker roda como root, apenas com o repositório montado em modo leitura.
#  - Sem cache, para que qualquer edição em index.html ou em games/** apareça
#    imediatamente ao recarregar a página do preview.
user root;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem cache: o preview precisa sempre refletir o código atual do sandbox.
    add_header Cache-Control "no-store" always;

    # Resposta fixa para o healthcheck do Compose.
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # Não serve metadados internos do repositório.
    location ~ /\.(git|base44) {
      deny all;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
